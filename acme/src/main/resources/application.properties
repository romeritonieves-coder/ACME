# =====================================================================
# SICA - Sistema Integrado de Control de Acceso para Zona Acme
# Spring Boot Configuration
# =====================================================================

spring.application.name=sica-access-control
server.port=8080

# Database Configuration (Docker MySQL 8.4)
spring.datasource.url=jdbc:mysql://localhost:3307/sica_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=root2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Static Resources & Web Configuration
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Bogota
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration
logging.level.com.acme.sica=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
